<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <style>
      .skin { fill: #FFE0BD; } 
      .skin-shadow { fill: #E3B899; }
      .hair { fill: #3E2F2B; }
      .feature { fill: #333333; }
      .line { 
        fill: transparent; 
        stroke: #333333; 
        stroke-width: 2.5; 
        stroke-linecap: round; 
        stroke-linejoin: round;
      }
      .blush { fill: #FF8C69; opacity: 0.35; }
      .shirt { fill: #4A90E2; }
    </style>
  </defs>

  <!-- Gentle Breathing Body/Torso -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,1; 0,0" 
      dur="4s" 
      repeatCount="indefinite" 
    />
    <!-- Shoulders -->
    <path d="M 15 100 Q 50 65 85 100 Z" class="shirt" />
    <!-- Neck -->
    <rect x="38" y="55" width="24" height="30" class="skin-shadow" />
  </g>

  <!-- Hair Background (Back of head) -->
  <circle cx="50" cy="45" r="37" class="hair" />

  <!-- Ears (Neutral forward-facing position) -->
  <circle cx="15" cy="48" r="6.5" class="skin" />
  <path d="M 13 46 Q 16 48 13 50" class="line" style="stroke-width: 1.5;" />
  
  <circle cx="85" cy="48" r="6.5" class="skin" />
  <path d="M 87 46 Q 84 48 87 50" class="line" style="stroke-width: 1.5;" />

  <!-- Base Head -->
  <circle cx="50" cy="45" r="34" class="skin" />

  <!-- Hair Foreground (Bangs - resting normally) -->
  <path d="M 16 42 Q 25 15 50 15 Q 75 15 84 42 Q 75 25 60 22 Q 50 32 40 22 Q 25 25 16 42 Z" class="hair" />

  <!-- Facial Features -->
  <g>
    <!-- Eyebrows (Maintained natural curve and consistent face shape) -->
    <path d="M 28 31 Q 35 28 42 31" class="line" style="stroke-width: 2;" />
    <path d="M 58 31 Q 65 28 72 31" class="line" style="stroke-width: 2;" />

    <!-- Eyes with Quick Blink Animation -->
    <ellipse cx="35" cy="40" rx="3.5" ry="3.5" class="feature">
      <!-- Shortened cycle to 1.5s and tightened the keyTimes for a faster snap -->
      <animate 
        attributeName="ry" 
        values="3.5; 3.5; 0.1; 3.5; 3.5" 
        keyTimes="0; 0.90; 0.94; 0.98; 1" 
        dur="1.5s" 
        repeatCount="indefinite" 
      />
    </ellipse>
    <ellipse cx="65" cy="40" rx="3.5" ry="3.5" class="feature">
      <animate 
        attributeName="ry" 
        values="3.5; 3.5; 0.1; 3.5; 3.5" 
        keyTimes="0; 0.90; 0.94; 0.98; 1" 
        dur="1.5s" 
        repeatCount="indefinite" 
      />
    </ellipse>

    <!-- Nose -->
    <path d="M 50 43 Q 53 48 48 49" class="line" style="stroke-width: 2;" />

    <!-- Rosy Cheeks -->
    <circle cx="27" cy="46" r="4.5" class="blush" />
    <circle cx="73" cy="46" r="4.5" class="blush" />

    <!-- Mouth (Natural, soft resting curve) -->
    <path d="M 39 56 Q 50 58 61 56" class="line" style="stroke-width: 2.5; stroke-linecap: round;" />
  </g>
</svg>
