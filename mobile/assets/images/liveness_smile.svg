<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <style>
      .skin { fill: #FFE0BD; } 
      .skin-shadow { fill: #E3B899; }
      .hair { fill: #3E2F2B; }
      .feature { fill: #333333; }
      .line { 
        fill: transparent; 
        stroke: #333333; 
        stroke-width: 2.5; 
        stroke-linecap: round; 
        stroke-linejoin: round;
      }
      .mouth {
        fill: transparent; 
        stroke: #333333; 
        stroke-width: 3; 
        stroke-linecap: round; 
      }
      .blush { fill: #FF8C69; opacity: 0.35; }
      .shirt { fill: #4A90E2; }
    </style>
  </defs>

  <!-- Breathing Body/Torso -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,1; 0,0" 
      dur="4s" 
      repeatCount="indefinite" 
    />
    <!-- Shoulders -->
    <path d="M 15 100 Q 50 65 85 100 Z" class="shirt" />
    <!-- Neck -->
    <rect x="38" y="55" width="24" height="30" class="skin-shadow" />
  </g>

  <!-- Hair Background (Back of head) -->
  <circle cx="50" cy="45" r="37" class="hair" />

  <!-- Ears (Neutral forward-facing position) -->
  <circle cx="15" cy="48" r="6.5" class="skin" />
  <path d="M 13 46 Q 16 48 13 50" class="line" style="stroke-width: 1.5;" />
  
  <circle cx="85" cy="48" r="6.5" class="skin" />
  <path d="M 87 46 Q 84 48 87 50" class="line" style="stroke-width: 1.5;" />

  <!-- Base Head -->
  <circle cx="50" cy="45" r="34" class="skin" />

  <!-- Hair Foreground (Bangs - resting normally) -->
  <path d="M 16 42 Q 25 15 50 15 Q 75 15 84 42 Q 75 25 60 22 Q 50 32 40 22 Q 25 25 16 42 Z" class="hair" />

  <!-- Facial Features -->
  <g>
    <!-- Eyebrows (Raise slightly as the smile grows wide) -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 0,-1.5; 0,0" 
        dur="4s" 
        repeatCount="indefinite" 
      />
      <path d="M 28 32 Q 35 29 42 32" class="line" style="stroke-width: 2;" />
      <path d="M 58 32 Q 65 29 72 32" class="line" style="stroke-width: 2;" />
    </g>

    <!-- Eyes with smooth blinking -->
    <ellipse cx="35" cy="40" rx="3.5" ry="3.5" class="feature">
      <animate attributeName="ry" values="3.5; 3.5; 0.5; 3.5; 3.5" keyTimes="0; 0.45; 0.5; 0.55; 1" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="65" cy="40" rx="3.5" ry="3.5" class="feature">
      <animate attributeName="ry" values="3.5; 3.5; 0.5; 3.5; 3.5" keyTimes="0; 0.45; 0.5; 0.55; 1" dur="4s" repeatCount="indefinite" />
    </ellipse>

    <!-- Nose -->
    <path d="M 50 43 Q 53 48 48 49" class="line" style="stroke-width: 2;" />

    <!-- Rosy Cheeks (Raise slightly as the face smiles, mirroring real cheek muscles) -->
    <g>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 0,-2.5; 0,0" 
        dur="4s" 
        repeatCount="indefinite" 
      />
      <circle cx="27" cy="47" r="4.5" class="blush" />
      <circle cx="73" cy="47" r="4.5" class="blush" />
    </g>

    <!-- Smile (Transitions from a subtle closed smile to a wide, happy beam) -->
    <path class="mouth" d="M 38 56 Q 50 61 62 56">
      <animate 
        attributeName="d" 
        values="M 38 56 Q 50 61 62 56; M 33 54 Q 50 72 67 54; M 38 56 Q 50 61 62 56" 
        dur="4s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>
</svg>
